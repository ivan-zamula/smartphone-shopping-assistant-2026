[project]
name = "rag-phones"
version = "0.1.0"
description = "Reproducible smartphone catalog preparation and Qdrant ingestion"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "qdrant-client>=1.15,<2",
    "sentence-transformers>=5,<6",
    "torch>=2.5,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_phones"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
